<svg xmlns="http://www.w3.org/2000/svg" width="980" height="476" viewBox="0 0 980 476" role="img" aria-label="VeilBreak Dual-Stage Browser Integrity Gate Architecture">
  <defs>
    <marker id="vb-edge-dark" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#5A6F8A" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vb-acc-dark" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#38BDF8" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vb-ok-dark" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#34D399" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vb-deny-dark" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#F87171" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="vb-clip-ok-dark"><rect x="802" y="138" width="156" height="114" rx="9"/></clipPath>
    <clipPath id="vb-clip-dn-dark"><rect x="802" y="296" width="156" height="114" rx="9"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .hub-title { font-size: 14.5px; font-weight: 700; fill: #F0F6FC; letter-spacing: -0.2px; }
      .badge-txt { font-size: 9.5px; font-weight: 700; fill: #7DD3FC; letter-spacing: 0.55px; text-anchor: middle; }
      .col-hdr   { font-size: 10.4px; font-weight: 700; fill: #D8E4F2; letter-spacing: 0.6px; }
      .step-num  { font-size: 10px; font-weight: 700; fill: #7DD3FC; text-anchor: middle; }
      .card-ttl  { font-size: 12px; font-weight: 700; fill: #F0F6FC; }
      .body      { font-size: 10.6px; font-weight: 400; fill: #BACAE0; }
      .muted     { font-size: 10.1px; font-weight: 400; fill: #93A8C2; }
      .muted-c   { font-size: 10px; font-weight: 400; fill: #93A8C2; text-anchor: middle; }
      .mono-c    { font-size: 10px; font-weight: 700; fill: #7DD3FC; text-anchor: middle; }
      .pill-txt  { font-size: 8.8px; font-weight: 700; fill: #7DD3FC; letter-spacing: 0.45px; text-anchor: middle; }
      .tag-txt   { font-size: 8.8px; font-weight: 700; fill: #A6BAD2; letter-spacing: 0.45px; text-anchor: middle; }
      .ok-t      { font-size: 12px; font-weight: 700; fill: #A7F3D0; }
      .dn-t      { font-size: 12px; font-weight: 700; fill: #FECACA; }
      .edge      { fill: none; stroke: #5A6F8A; stroke-width: 1.4; stroke-linecap: round; }
      .edge-acc  { fill: none; stroke: #38BDF8; stroke-width: 1.5; stroke-linecap: round; }
      .edge-ok   { fill: none; stroke: #34D399; stroke-width: 1.5; stroke-linecap: round; }
      .edge-deny { fill: none; stroke: #F87171; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Self-contained rounded surface canvas -->
  <rect x="1" y="1" width="978" height="474" rx="14" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- TOP BANNER -->
  <g id="vb-header">
    <rect x="22" y="20" width="936" height="56" rx="10" fill="#111824" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="120" y1="20.6" x2="860" y2="20.6" stroke="#7DD3FC" stroke-width="1" opacity="0.4"/>

    <rect x="38" y="37.5" width="114" height="21" rx="5" fill="#0D2538" stroke="#25638A" stroke-width="0.9"/>
    <text class="mono badge-txt" x="95" y="51.5">DUAL-STAGE GATE</text>

    <text class="sans hub-title" x="168" y="52.5">VeilBreak — Multi-Engine Browser Integrity Architecture</text>

    <rect x="740" y="37.5" width="202" height="21" rx="5" fill="#0D2538" stroke="#25638A" stroke-width="0.9"/>
    <text class="mono badge-txt" x="841" y="51.5">14 INVARIANTS · ZERO DEPS</text>
  </g>

  <!-- STAGE 01: INCOMING CLIENT -->
  <g id="vb-col1">
    <rect x="22" y="170" width="154" height="208" rx="11" fill="#101620" stroke="#233044" stroke-width="1.15"/>
    <rect x="36" y="186" width="24" height="19" rx="5" fill="#0D2436" stroke="#1F4F73" stroke-width="0.9"/>
    <text class="mono step-num" x="48" y="199">01</text>
    <text class="sans col-hdr" x="68" y="199.5">CLIENT</text>
    <line x1="36" y1="216" x2="162" y2="216" stroke="#1D2838" stroke-width="1"/>

    <text class="sans card-ttl" x="36" y="242">Browser / Agent</text>
    <text class="sans body" x="36" y="264">Chromium · Gecko</text>
    <text class="sans muted" x="36" y="282">Human, Headless,</text>
    <text class="sans muted" x="36" y="298">or Stealth Fork</text>

    <rect x="36" y="324" width="126" height="34" rx="6" fill="#151D29" stroke="#2D3B50" stroke-width="1"/>
    <text class="mono muted-c" x="99" y="339" font-size="9.5">UA + Sec-CH-UA</text>
    <text class="sans muted-c" x="99" y="352" font-size="9.3">Request Headers</text>
  </g>

  <!-- CONNECTOR 1 -> 2 (54px channel) -->
  <line class="edge-acc" x1="176" y1="274" x2="224" y2="274" marker-end="url(#vb-acc-dark)"/>
  <text class="mono-c" x="201" y="262">gate.js</text>

  <!-- STAGE 02: DUAL-STAGE CLIENT ENGINE -->
  <g id="vb-col2">
    <rect x="230" y="96" width="260" height="356" rx="11" fill="#101620" stroke="#233044" stroke-width="1.15"/>
    <rect x="244" y="112" width="24" height="19" rx="5" fill="#0D2436" stroke="#1F4F73" stroke-width="0.9"/>
    <text class="mono step-num" x="256" y="125">02</text>
    <text class="sans col-hdr" x="276" y="125.5">DUAL-STAGE CLIENT ENGINE</text>
    <line x1="244" y1="142" x2="476" y2="142" stroke="#1D2838" stroke-width="1"/>

    <!-- Stage 1 Subcard -->
    <rect x="244" y="158" width="232" height="122" rx="8" fill="#151D29" stroke="#2D3B50" stroke-width="1.1"/>
    <text class="sans card-ttl" x="256" y="180">Stage 1 · 14 Passive Probes</text>
    <text class="sans body" x="256" y="200">Canvas2D · WebGL · Audio · Rect</text>
    <text class="sans body" x="256" y="218">OS Fonts · Viewport · CDP · Engine</text>
    <rect x="256" y="234" width="162" height="20" rx="5" fill="#0C2C42" stroke="#25709C" stroke-width="0.8"/>
    <text class="mono pill-txt" x="337" y="247">FRESH IFRAME + WORKER</text>
    <text class="sans muted" x="256" y="270">&lt; 20 ms median · zero interaction</text>

    <!-- Vertical transition arrow -->
    <line class="edge" x1="360" y1="280" x2="360" y2="306" marker-end="url(#vb-edge-dark)"/>

    <!-- Stage 2 Subcard -->
    <rect x="244" y="312" width="232" height="122" rx="8" fill="#151D29" stroke="#2D3B50" stroke-width="1.1"/>
    <text class="sans card-ttl" x="256" y="334">Stage 2 · Click Kinematics</text>
    <text class="sans body" x="256" y="354">isTrusted · Pointer Path · Dwell</text>
    <text class="sans body" x="256" y="372">Center-Hit · Keyboard Exempt</text>
    <rect x="256" y="388" width="164" height="20" rx="5" fill="#1B2638" stroke="#2E3E56" stroke-width="0.8"/>
    <text class="mono tag-txt" x="338" y="401">&lt;veil-break&gt; SHADOW DOM</text>
    <text class="sans muted" x="256" y="424">Catches headed CDP / teleport clicks</text>
  </g>

  <!-- CONNECTOR 2 -> 3 (90px channel) -->
  <line class="edge-acc" x1="490" y1="274" x2="574" y2="274" marker-end="url(#vb-acc-dark)"/>
  <text class="mono-c" x="533" y="261">VB_ATTEST_V2</text>
  <text class="sans muted-c" x="533" y="291">IP/UA + PoW</text>

  <!-- STAGE 03: SERVER VERIFIER GATE -->
  <g id="vb-col3">
    <rect x="580" y="138" width="180" height="272" rx="11" fill="#102232" stroke="#2B77A3" stroke-width="1.25"/>
    <rect x="594" y="154" width="24" height="19" rx="5" fill="#0D2436" stroke="#1F4F73" stroke-width="0.9"/>
    <text class="mono step-num" x="606" y="167">03</text>
    <text class="sans col-hdr" x="626" y="167.5">SERVER GATE</text>
    <line x1="594" y1="184" x2="746" y2="184" stroke="#1D2838" stroke-width="1"/>

    <text class="sans card-ttl" x="594" y="208">VeilBreak Verifier</text>
    <text class="sans body" x="594" y="228">Node Proxy / Express</text>
    <text class="sans body" x="594" y="245">Python Stdlib Verifier</text>

    <rect x="594" y="264" width="152" height="22" rx="5" fill="#0C2C42" stroke="#25709C" stroke-width="0.8"/>
    <text class="mono pill-txt" x="670" y="278.5">1-USE TICKET + POW</text>

    <rect x="594" y="300" width="152" height="92" rx="7" fill="#151D29" stroke="#2D3B50" stroke-width="1"/>
    <text class="sans" x="606" y="320" font-size="10.4" font-weight="700" fill="#F0F6FC">Server Cross-Checks</text>
    <text class="sans muted" x="606" y="338">· IP/UA + PoW + path</text>
    <text class="sans muted" x="606" y="354">· Fetch Meta &amp; UA</text>
    <text class="sans muted" x="606" y="370">· Strict &gt;=2 · Bal &gt;=4</text>
  </g>

  <!-- DECISION FORK (3 -> 4) -->
  <path class="edge-ok" d="M 760,236 C 782,236 778,195 796,195" marker-end="url(#vb-ok-dark)"/>
  <path class="edge-deny" d="M 760,312 C 782,312 778,353 796,353" marker-end="url(#vb-deny-dark)"/>

  <!-- STAGE 04: ALLOW & DENY OUTCOMES (156px wide) -->
  <g id="vb-col4">
    <rect x="802" y="138" width="156" height="114" rx="9" fill="#0E1D1B" stroke="#225E4C" stroke-width="1.2"/>
    <g clip-path="url(#vb-clip-ok-dark)">
      <rect x="802" y="138" width="4" height="114" fill="#34D399"/>
    </g>
    <text class="mono ok-t" x="818" y="166">HTTP 200 OK</text>
    <text class="sans body" x="818" y="190">Upstream App / API</text>
    <text class="sans muted" x="818" y="210">Desktop Chrome &amp;</text>
    <text class="sans muted" x="818" y="226">Firefox controls pass</text>

    <rect x="802" y="296" width="156" height="114" rx="9" fill="#221216" stroke="#7F2B34" stroke-width="1.2"/>
    <g clip-path="url(#vb-clip-dn-dark)">
      <rect x="802" y="296" width="4" height="114" fill="#F87171"/>
    </g>
    <text class="mono dn-t" x="818" y="324">HTTP 403</text>
    <text class="mono" x="818" y="346" font-size="10" font-weight="700" fill="#FECACA">VEILBREAK_DENIED</text>
    <text class="sans muted" x="818" y="368">Score &gt;= threshold</text>
    <text class="sans muted" x="818" y="384">or invalid ticket</text>
  </g>
</svg>
