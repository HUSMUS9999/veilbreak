<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-label="VeilBreak Dual-Stage Browser Integrity Gate Architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8B949E"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#22C55E"/>
    </marker>
    <marker id="arr-deny" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#F87171"/>
    </marker>
    <style>
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1.25; }
      .sub  { fill: #0D1117; stroke: #30363D; stroke-width: 1.15; }
      .acc  { fill: #0C2D48; stroke: #38BDF8; stroke-width: 1.35; }
      .ok   { fill: #052E16; stroke: #22C55E; stroke-width: 1.35; }
      .deny { fill: #2A1215; stroke: #F87171; stroke-width: 1.35; }
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #E6EDF3; text-anchor: middle; }
      .tl   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #E6EDF3; text-anchor: start; }
      .b    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.6px; fill: #C9D1D9; text-anchor: middle; }
      .m    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8B949E; text-anchor: middle; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.2px; font-weight: 600; fill: #7DD3FC; text-anchor: middle; }
      .ok-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.2px; font-weight: 700; fill: #86EFAC; text-anchor: middle; }
      .dn-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.2px; font-weight: 700; fill: #FCA5A5; text-anchor: middle; }
      .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.7px; fill: #7DD3FC; text-anchor: middle; }
      .e    { fill: none; stroke: #8B949E; stroke-width: 1.35; }
      .ea   { fill: none; stroke: #38BDF8; stroke-width: 1.45; }
      .eok  { fill: none; stroke: #22C55E; stroke-width: 1.45; }
      .edn  { fill: none; stroke: #F87171; stroke-width: 1.45; }
    </style>
  </defs>

  <!-- Left: Incoming Client -->
  <rect class="card" x="14" y="96" width="132" height="98" rx="9"/>
  <text class="kicker" x="80" y="118">CLIENT</text>
  <text class="t" x="80" y="140">Browser / Agent</text>
  <text class="m" x="80" y="158">Chromium · Gecko</text>
  <text class="m" x="80" y="174">Human or Stealth</text>

  <!-- Arrow Client -> Client Integrity Engine (gap: 54px) -->
  <line class="ea" x1="146" y1="145" x2="196" y2="145" marker-end="url(#arr-acc)"/>
  <text class="m" x="171" y="135">gate.js</text>

  <!-- Middle-Left: Dual-Stage Client Engine -->
  <rect class="card" x="200" y="24" width="214" height="244" rx="10"/>
  <text class="kicker" x="307" y="45">DUAL-STAGE CLIENT ENGINE</text>

  <rect class="sub" x="214" y="58" width="186" height="86" rx="7"/>
  <text class="t" x="307" y="79">Stage 1: 14 Passive Probes</text>
  <text class="m" x="307" y="96">Canvas2D · WebGL · Audio · Fonts</text>
  <text class="m" x="307" y="111">DOMRect · Viewport · CDP</text>
  <text class="mono" x="307" y="129">Fresh iframe + Web Worker</text>

  <line class="e" x1="307" y1="144" x2="307" y2="160" marker-end="url(#arr)"/>

  <rect class="sub" x="214" y="164" width="186" height="86" rx="7"/>
  <text class="t" x="307" y="185">Stage 2: Click Kinematics</text>
  <text class="m" x="307" y="202">isTrusted · Pointer Trajectory</text>
  <text class="m" x="307" y="217">Button Dwell ms · Center-Hit</text>
  <text class="mono" x="307" y="235">&lt;veil-break&gt; Shadow DOM</text>

  <!-- Arrow Engine -> Server Verifier (generous 96px gap so VB_ATTEST_V2 never touches edges!) -->
  <line class="ea" x1="414" y1="145" x2="506" y2="145" marker-end="url(#arr-acc)"/>
  <text class="mono" x="460" y="133">VB_ATTEST_V2</text>
  <text class="m" x="460" y="161">Ticket + Nonce</text>

  <!-- Middle-Right: Server Verifier -->
  <rect class="acc" x="510" y="82" width="168" height="126" rx="10"/>
  <text class="kicker" x="594" y="104">SERVER GATE</text>
  <text class="t" x="594" y="126">VeilBreak Verifier</text>
  <text class="m" x="594" y="145">Node Middleware / Proxy</text>
  <text class="m" x="594" y="161">or Python Stdlib Verifier</text>
  <text class="mono" x="594" y="182">1-Time Ticket + SHA-256</text>
  <text class="m" x="594" y="197">UA / Client-Hints Parity</text>

  <!-- Split Decision Arrows -->
  <path class="eok" d="M 678,118 C 702,118 702,78 726,78" marker-end="url(#arr-ok)"/>
  <path class="edn" d="M 678,172 C 702,172 702,212 726,212" marker-end="url(#arr-deny)"/>

  <!-- Right Top: Allow -->
  <rect class="ok" x="730" y="38" width="136" height="80" rx="8"/>
  <text class="ok-t" x="798" y="64">HTTP 200 OK</text>
  <text class="m" x="798" y="82">Upstream App / API</text>
  <text class="m" x="798" y="98">0% FP Chrome/Firefox</text>

  <!-- Right Bottom: Deny -->
  <rect class="deny" x="730" y="172" width="136" height="80" rx="8"/>
  <text class="dn-t" x="798" y="198">HTTP 403</text>
  <text class="m" x="798" y="216">VEILBREAK_DENIED</text>
  <text class="m" x="798" y="232">Score >= Threshold</text>
</svg>
